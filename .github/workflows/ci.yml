name: Terraform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  issues: write
  pull-requests: write

jobs:
  terraform-validate:
    name: Terraform fmt / validate / tflint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - bootstrap
          - modules/networking
          - modules/aks
          - modules/database
          - modules/key-vault
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive ${{ matrix.module }}

      - name: Terraform init (no backend, validate only)
        run: terraform init -backend=false
        working-directory: ${{ matrix.module }}

      - name: Terraform validate
        run: terraform validate
        working-directory: ${{ matrix.module }}

      - name: Set up tflint
        uses: terraform-linters/setup-tflint@v4

      - name: Run tflint
        run: tflint --chdir=${{ matrix.module }}

  trivy-scan:
    name: Trivy IaC security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: "config"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy results to Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"

  guardline-scan:
    name: GuardLine pipeline config scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run GuardLine
        uses: toutlawbradley/GuardLine@v1.2.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}